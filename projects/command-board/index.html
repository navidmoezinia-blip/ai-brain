<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Brain Radial Canvas — Infinite Multi-LLM Cloud Board</title>
  <meta
    name="description"
    content="Circular infinite spatial board for orchestrating OpenAI Codex, Claude, and Antigravity / Gemini cloud runs across navidmoezinia-blip/ai-brain."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@450;500;560;620;680&family=JetBrains+Mono:wght@450;550;650&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Top-Left Floating HUD: Title & Workflow Presets -->
  <header class="hud-bar hud-top-left">
    <h1 class="hud-title">AI Brain Orbit</h1>
    <div class="hud-divider"></div>
    <div id="hud-presets" style="display:flex;align-items:center;gap:3px;flex-wrap:wrap;"></div>
  </header>

  <!-- Top-Right Floating HUD: GitHub Sync, Snap Layout & Theme -->
  <div class="hud-bar hud-top-right">
    <button type="button" id="sync-github-btn" class="btn" title="Pull live PRs into outer orbit">
      Sync PRs
    </button>
    <button type="button" id="gh-config-btn" class="btn" title="Connect GitHub token for Issue dispatch & PR sync">
      GitHub Token
    </button>
    <button type="button" id="snap-radial-btn" class="btn" title="Reset nodes into circular radial layout">
      Snap Circle
    </button>
    <button type="button" id="theme-btn" class="btn" title="Toggle light / dark theme">
      Theme
    </button>
  </div>

  <!-- Infinite Spatial Viewport -->
  <main id="canvas-viewport" class="canvas-viewport" aria-label="Infinite radial multi-LLM canvas">
    <div id="canvas-world" class="canvas-world">
      <svg id="world-svg" class="world-svg" aria-hidden="true"></svg>
      <div id="nodes-layer"></div>
    </div>
  </main>

  <!-- Bottom-Left Floating Hint -->
  <div class="hud-bar hud-bottom-left" style="font-size:0.73rem;color:var(--text-secondary);">
    <span>Drag canvas to pan · Scroll to zoom · Drag any node</span>
  </div>

  <!-- Bottom-Right Floating Zoom Controls -->
  <div class="hud-bar hud-bottom-right">
    <button type="button" id="zoom-out-btn" class="btn" aria-label="Zoom out">&minus;</button>
    <span id="zoom-readout" style="font-family:var(--font-mono);font-size:0.74rem;min-width:42px;text-align:center;">80%</span>
    <button type="button" id="zoom-in-btn" class="btn" aria-label="Zoom in">+</button>
    <button type="button" id="zoom-fit-btn" class="btn">Fit</button>
  </div>

  <!-- Floating Inspector Drawer (Full Prompt / Satellite Details) -->
  <aside id="inspector-drawer" class="inspector-drawer" hidden>
    <div id="inspector-body" style="display:flex;flex-direction:column;gap:10px;"></div>
  </aside>

  <!-- GitHub Sync Configuration Modal -->
  <div id="gh-modal" class="modal-backdrop" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="gh-modal-heading">
      <h2 id="gh-modal-heading" style="margin:0 0 6px;font-size:0.98rem;">GitHub Cloud Sync</h2>
      <p style="margin:0 0 14px;font-size:0.78rem;color:var(--text-secondary);">
        Stored locally in your browser (`localStorage`) only — never committed to git. Connects your radial board to live PRs and GitHub Issues.
      </p>

      <div style="margin-bottom:12px;">
        <label for="gh-repo-input" style="display:block;font-size:0.75rem;margin-bottom:4px;color:var(--text-secondary);">
          Repository (`owner/repo`)
        </label>
        <input
          id="gh-repo-input"
          class="compact-input"
          style="width:100%;padding:7px 10px;font-size:0.82rem;"
          type="text"
          value="navidmoezinia-blip/ai-brain"
        />
      </div>

      <div style="margin-bottom:16px;">
        <label for="gh-token-input" style="display:block;font-size:0.75rem;margin-bottom:4px;color:var(--text-secondary);">
          Fine-Grained GitHub PAT (`Issues` &amp; `Pull requests` access on `ai-brain`)
        </label>
        <input
          id="gh-token-input"
          class="compact-input"
          style="width:100%;padding:7px 10px;font-size:0.82rem;"
          type="password"
          placeholder="github_pat_..."
          autocomplete="off"
        />
      </div>

      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button type="button" id="gh-modal-cancel" class="btn">Cancel</button>
        <button type="button" id="gh-modal-save" class="btn btn-primary">Save &amp; Sync</button>
      </div>
    </div>
  </div>

  <div id="app-toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="./app.js"></script>
</body>
</html>
